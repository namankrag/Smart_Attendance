# Smart Attendance — UI + ML worker (Phase 2).
# Not a deployment: no image is pushed or hosted by this file; run it
# locally with `docker compose up --build`. The deployment decision
# (Streamlit Cloud vs container; Cloud Run vs Render for the worker)
# still needs Naman.
#
# Worker secrets are passed via its environment — see worker/README.md.
# Never commit real values: use a local .env file (gitignored) or your
# host's secret store. The UI receives only its Streamlit secrets file;
# HF_TOKEN and SUPABASE_SERVICE_ROLE_KEY stay out of the UI container.
services:
  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports:
      - "8501:8501"
    environment:
      # The UI reaches both REST data routes and ML jobs at the worker.
      DATA_API_URL: http://worker:8000
      ML_WORKER_URL: http://worker:8000
      # This must match the worker's .env value; it is not a Supabase key.
      API_INTERNAL_TOKEN: ${API_INTERNAL_TOKEN:-}
    volumes:
      - ./.streamlit/secrets.toml:/app/.streamlit/secrets.toml:ro
    depends_on:
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    ports:
      - "8000:8000"
    environment:
      MODEL_DIR: /models
      FACE_BACKEND: onnx
      # DATABASE_URL: empty → in-memory job store (dev only). Set a
      # Postgres DSN for the real FOR UPDATE SKIP LOCKED queue.
      # DATABASE_URL: ${DATABASE_URL:-}
      # SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY / HF_TOKEN: worker env
      # only — set them in the host environment or .env (never in git).
    env_file:
      - .env
    healthcheck:
      # /healthz = liveness; /readyz (model files + store) is the
      # readiness gate the UI's worker client can also poll.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
